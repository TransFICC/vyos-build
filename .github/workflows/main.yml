---
# This is a basic workflow to help you get started with Actions
# rebased against upstream/current = e01283e75aaf21bc171b4aa791206b498380c1eb
# previously rebased against dc5e42b9daa97a35ab9fa4cb473b62b7abb146da

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the current branch
on: # yamllint disable-line rule:truthy
  push:
    branches: [ current ]
  pull_request:
    branches: [ current ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      - name: Install docker and prerequisites
        run: |
          sudo apt update
          sudo apt install -y apt-transport-https ca-certificates curl gnupg2 software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt update
          sudo apt install -y docker-ce docker-ce-cli containerd.io

      - name: Set VERSION variable
        run: |
          echo "VERSION=1.4-rolling-$(date +%Y%m%d%H%M)-transficc" >> $GITHUB_ENV

#     - name: Enable some additional services by default
#       run: |
#         echo <<EOSERVICES >> $GITHUB_WORKSPACE/data/live-build-config/hooks/live/18-enable-disable_services.chroot
#         systemctl enable telegraf.service
#         systemctl enable sssd.service
#         systemctl enable nslcd.service
#         systemctl enable pdns-recursor.service
#         EOSERVICES

      - name: Pull in custom vyos-1x
        run: |
          cd $GITHUB_WORKSPACE/packages
          wget https://github.com/TransFICC/vyos-1x/releases/latest/download/vyos-1x_amd64.deb -O vyos-1x_amd64.deb
          echo "VYOS_1X_VERSION=$(dpkg-deb -I vyos-1x_amd64.deb | awk '/Version:/{print $2}')" >> $GITHUB_ENV

      - name: Build standard iso
        run: |
          pwd
          cd $GITHUB_WORKSPACE
          docker run --rm --privileged -v $GITHUB_WORKSPACE:/vyos -w /vyos vyos/vyos-build:current bash -c \
            "./configure --architecture amd64 --build-by sre@transficc.com --build-type release --version $VERSION-standard \
             --custom-package 'krb5-pkinit lighttpd python3-apt tmux realmd sssd libpam-ldapd nslcd kstart vim freeipa-client lighttpd-mod-deflate vyos-1x=$VYOS_1X_VERSION'; sudo make iso"
          mv $GITHUB_WORKSPACE/build/live-image-amd64.hybrid.iso vyos-$VERSION-standard.iso
          pwd
          ls -l . build

      - name: Build AWS iso
        run: |
          pwd
          cd $GITHUB_WORKSPACE
          docker run --rm --privileged -v $GITHUB_WORKSPACE:/vyos -w /vyos vyos/vyos-build:current bash -c \
            "./configure --architecture amd64 --build-by sre@transficc.com --build-type release --version $VERSION-aws \
             --custom-package 'krb5-pkinit lighttpd python3-apt tmux realmd sssd libpam-ldapd nslcd kstart vim freeipa-client lighttpd-mod-deflate vyos-1x=$VYOS_1X_VERSION'; sudo make AWS"
          mv $GITHUB_WORKSPACE/build/live-image-amd64.hybrid.iso vyos-$VERSION-aws.iso
          pwd
          ls -l . build

      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Upload standard release asset
        id: upload-release-asset-1
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`.
          # See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./vyos-${{ env.VERSION }}-standard.iso
          asset_name: vyos-standard.iso
          asset_content_type: application/x-iso9660-image

      - name: Upload AWS release asset
        id: upload-release-asset-2
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`.
          # See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./vyos-${{ env.VERSION }}-aws.iso
          asset_name: vyos-aws.iso
          asset_content_type: application/x-iso9660-image
